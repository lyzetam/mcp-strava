[project]
name = "mcp-strava"
version = "0.1.0"
description = "Read-only Model Context Protocol server that lets AI assistants read your Strava data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Landry Zetam" }]
requires-python = ">=3.12"
keywords = ["mcp", "model-context-protocol", "strava", "claude", "fitness", "running", "cycling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
]

[project.urls]
Homepage = "https://github.com/lyzetam/mcp-strava"
Documentation = "https://github.com/lyzetam/mcp-strava#readme"
Issues = "https://github.com/lyzetam/mcp-strava/issues"
Changelog = "https://github.com/lyzetam/mcp-strava/blob/main/CHANGELOG.md"

[project.scripts]
mcp-strava = "mcp_strava.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_strava"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
timeout = 30

[tool.coverage.run]
branch = true
source = ["mcp_strava"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
files = ["src"]
strict = true

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
